name: Historias diarias (revisión)

on:
  schedule:
    - cron: "0 6 * * *"        # 06:00 UTC = 07:00 (invierno) / 08:00 (verano) en Galicia. GitHub puede retrasarlo unos minutos
    - cron: "0 12 * * *"       # 13:00 / 14:00
    - cron: "30 16 * * *"      # 17:30 / 18:30
    - cron: "0 19 * * *"       # 20:00 / 21:00: resultados de los partidos de las 17:00 y 18:00
    - cron: "0 21 * * *"       # 22:00 / 23:00: resultados de los partidos de las 20:00
    - cron: "30 22 * * *"      # 23:30 / 00:30: resultados de los partidos de la noche
  workflow_dispatch:           # botón "Run workflow" para probarlo a mano

permissions:
  contents: write              # para guardar estado/publicado.json (lo ya generado) en el repositorio

jobs:
  historias:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generar las historias de hoy
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python diario.py
      - name: Guardar las historias para descargarlas
        uses: actions/upload-artifact@v4
        with:
          name: historias
          path: salida/
          retention-days: 14
      - name: Recordar lo ya generado
        run: |
          git config user.name "marexada-bot"
          git config user.email "marexada-bot@users.noreply.github.com"
          git add estado/publicado.json
          git diff --cached --quiet || (git commit -m "Estado del $(date -u +%F)" && git push)
