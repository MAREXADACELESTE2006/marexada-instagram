name: Historias diarias (revisión)

on:
  schedule:
    # --- Ejecuciones COMPLETAS (todo: parte médico, entradas, cumpleaños, clasificaciones, resumen...) ---
    - cron: "0 6 * * *"            # 06:00 UTC = 07:00 (invierno) / 08:00 (verano) en Galicia
    - cron: "30 16 * * *"          # 17:30 / 18:30
    - cron: "30 22 * * *"          # 23:30 / 00:30
    # --- Ejecuciones RÁPIDAS (solo convocatorias y resultados) ---
    - cron: "12,42 9-13 * * *"     # cada 30 min de 10:05 a 14:35 (invierno): para pillar la convocatoria cuando la publica el club
    - cron: "2-59/10 14-23 * * *"      # v69: copia de seguridad cada 10 min (en los minutos :02, :12, :22...) para NO coincidir con cron-job.org, que lanza el modo rápido cada 5 min (:00, :05, :10...). Resultados, goles, inicio y descanso. rccelta.es solo 1 vez por hora; besoccer y futbolme cada 10 min (ver diario.py, FUENTE_HOST)
  workflow_dispatch:               # botón "Run workflow" (a mano o desde un servicio externo): por defecto hace una ejecución completa
    inputs:
      modo:
        description: "completo (todo) o rapido (solo convocatorias y resultados)"
        default: "completo"
      forzar:
        description: "Marcar para volver a generar y enviar lo de hoy aunque ya se haya enviado (ignora estado/publicado.json)"
        type: boolean
        default: false

permissions:
  contents: write                  # para guardar estado/publicado.json y estado/agenda.json en el repositorio

concurrency:
  group: historias                 # una ejecución cada vez: así no se repiten historias ni se pisa el estado
  cancel-in-progress: false

jobs:
  historias:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MODO: ${{ github.event_name == 'workflow_dispatch' && (inputs.modo || 'completo') || (contains(fromJSON('["0 6 * * *","30 16 * * *","30 22 * * *"]'), github.event.schedule) && 'completo' || 'rapido') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generar las historias
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_SIMULACRO: ${{ vars.IG_SIMULACRO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python diario.py --modo "$MODO" ${{ (github.event_name == 'workflow_dispatch' && inputs.forzar) && '--forzar' || '' }}
      - name: Publicar en Instagram
        if: always()                   # también si diario.py avisa de un error: lo que ya estaba en cola sigue saliendo
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_SIMULACRO: ${{ vars.IG_SIMULACRO }}
          IG_PAUSA: ${{ vars.IG_PAUSA }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python instagram.py
      - name: Guardar las historias para descargarlas
        uses: actions/upload-artifact@v4
        with:
          name: historias
          path: salida/
          retention-days: 14
          if-no-files-found: ignore
      - name: Recordar lo ya generado
        if: always()
        run: |
          git config user.name "marexada-bot"
          git config user.email "marexada-bot@users.noreply.github.com"
          mkdir -p estado
          git add estado/
          if ! git diff --cached --quiet; then
            git commit -m "Estado del $(date -u +%F)"
            # v74: si mientras tanto alguien subió algo a main (p. ej. una versión nueva por la web), el push se rechazaba y el estado
            # se perdía sin avisar: la siguiente ejecución repetía las historias. Ahora se reintenta encima de lo nuevo.
            for i in 1 2 3 4; do
              git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
            echo "::error::No se pudo guardar estado/ en el repositorio; la próxima ejecución puede repetir historias"
            exit 1
          fi
